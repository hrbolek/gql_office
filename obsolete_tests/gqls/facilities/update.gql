mutation facilityUpdate($id: UUID!, $lastchange: DateTime!, $name: String, $nameEn: String, $label: String, $address: String, $valid: Boolean, $capacity: Int, $geometry: String, $geolocation: String) {
  facilityUpdate(facility: {id: $id, lastchange: $lastchange, name: $name, nameEn: $nameEn, label: $label, address: $address, valid: $valid, capacity: $capacity, geometry: $geometry, geolocation: $geolocation}) {
  ... on FacilityGQLModel { ...Facility }
  ... on FacilityGQLModelUpdateError { ...Error }
}
}

fragment User on UserGQLModel {
      __typename
      id
    }

fragment RBACObject on RBACObjectGQLModel {
      __typename
      id
    }

fragment EventFacilityReservation on EventFacilityReservationGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      eventId
      event { id }
      facilityId
      facility { id }
      stateId
      state { id }
    }

fragment FacilityType on FacilityTypeGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      name
      nameEn
      parent { id }
      parentId
      children { id }
    }

fragment Group on GroupGQLModel {
      __typename
      id
    }

fragment Facility on FacilityGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby {
  ...User
}
    changedby {
  ...User
}
    rbacobject {
  ...RBACObject
}
    name
    nameEn
    label
    startdate
    enddate
    address
    valid
    capacity
    geometry
    geolocation
    reservations {
  ...EventFacilityReservation
}
    groupId
    facilitytypeId
    masterFacilityId
    type {
  ...FacilityType
}
    masterFacility { id }
    masterFacilities { id }
    subFacilities { id }
    group {
  ...Group
}
  }

fragment Error on FacilityGQLModelUpdateError {
    __typename
    Entity {
  ...Facility
}
    msg
    failed
    input
  }
