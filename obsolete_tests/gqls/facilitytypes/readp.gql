query facilityTypePage($skip: Int, $limit: Int, $orderby: String, $where: FacilityTypeInputFilter) {
  facilityTypePage(skip: $skip, limit: $limit, orderby: $orderby, where: $where) {
  ...FacilityType
}
}

fragment User on UserGQLModel {
    __typename
    id
  }

fragment RBACObject on RBACObjectGQLModel {
    __typename
    id
  }

fragment FacilityType on FacilityTypeGQLModel {
  __typename
  id
  lastchange
  created
  createdbyId
  changedbyId
  rbacobjectId
  createdby {
  ...User
}
  changedby {
  ...User
}
  rbacobject {
  ...RBACObject
}
  name
  nameEn
  parent { id }
  parentId
  children { id }
}
