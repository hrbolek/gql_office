mutation facilityTypeUpdate($id: UUID!, $lastchange: DateTime!, $name: String, $nameEn: String) {
  facilityTypeUpdate(facilityType: {id: $id, lastchange: $lastchange, name: $name, nameEn: $nameEn}) {
  ... on FacilityTypeGQLModel { ...FacilityType }
  ... on FacilityTypeGQLModelUpdateError { ...Error }
}
}

fragment User on UserGQLModel {
      __typename
      id
    }

fragment RBACObject on RBACObjectGQLModel {
      __typename
      id
    }

fragment FacilityType on FacilityTypeGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby {
  ...User
}
    changedby {
  ...User
}
    rbacobject {
  ...RBACObject
}
    name
    nameEn
    parent { id }
    parentId
    children { id }
  }

fragment Error on FacilityTypeGQLModelUpdateError {
    __typename
    Entity {
  ...FacilityType
}
    msg
    failed
    input
  }
