mutation facilityTypeDelete($id: UUID!, $lastchange: DateTime!) {
  facilityTypeDelete(facilityType: {id: $id, lastchange: $lastchange}) {
  ...FacilityTypeGQLModelDeleteError
}
}

fragment User on UserGQLModel {
      __typename
      id
    }

fragment RBACObject on RBACObjectGQLModel {
      __typename
      id
    }

fragment FacilityType on FacilityTypeGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby {
  ...User
}
    changedby {
  ...User
}
    rbacobject {
  ...RBACObject
}
    name
    nameEn
    parent { id }
    parentId
    children { id }
  }

fragment FacilityTypeGQLModelDeleteError on FacilityTypeGQLModelDeleteError {
  __typename
  Entity {
  ...FacilityType
}
  msg
  failed
  input
}
