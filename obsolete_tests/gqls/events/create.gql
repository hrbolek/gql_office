mutation eventInsert($name: String, $nameEn: String, $description: String, $startDate: DateTime, $endDate: DateTime, $parentId: UUID, $id: UUID, $rbacobjectId: UUID) {
  eventInsert(event: {name: $name, nameEn: $nameEn, description: $description, startDate: $startDate, endDate: $endDate, parentId: $parentId, id: $id, rbacobjectId: $rbacobjectId}) {
  ... on EventGQLModel { ...Event }
  ... on InsertError { ...InsertError }
}
}

fragment User on UserGQLModel {
      __typename
      id
    }

fragment RBACObject on RBACObjectGQLModel {
      __typename
      id
    }

fragment Facility on FacilityGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      name
      nameEn
      label
      startdate
      enddate
      address
      valid
      capacity
      geometry
      geolocation
      reservations { id }
      groupId
      facilitytypeId
      masterFacilityId
      type { id }
      masterFacility { id }
      masterFacilities { id }
      subFacilities { id }
      group { id }
    }

fragment EventFacilityReservation on EventFacilityReservationGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      eventId
      event { id }
      facilityId
      facility { id }
      stateId
      state { id }
    }

fragment EventType on EventTypeGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      name
      nameEn
      description
      parentId
      parent { id }
      children { id }
      events { id }
    }

fragment EventInvitation on EventInvitationGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      eventId
      userId
      stateId
      event { id }
      user { id }
      state { id }
    }

fragment Event on EventGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby {
  ...User
}
    changedby {
  ...User
}
    rbacobject {
  ...RBACObject
}
    name
    nameEn
    description
    startdate
    enddate
    duration_raw
    place
    facilityId
    facility {
  ...Facility
}
    reservations {
  ...EventFacilityReservation
}
    mastereventId
    parent { id }
    children { id }
    typeId
    type {
  ...EventType
}
    invitations {
  ...EventInvitation
}
    # duration
  }

fragment InsertError on InsertError {
    __typename
    msg
    failed
    input
  }
