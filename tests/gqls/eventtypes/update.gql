mutation eventTypeUpdate($id: UUID!, $lastchange: DateTime!, $name: String, $nameEn: String) {
  eventTypeUpdate(eventType: {id: $id, lastchange: $lastchange, name: $name, nameEn: $nameEn}) {
  ... on EventTypeGQLModel { ...EventType }
  ... on EventTypeGQLModelUpdateError { ...Error }
}
}

fragment User on UserGQLModel {
      __typename
      id
    }

fragment RBACObject on RBACObjectGQLModel {
      __typename
      id
    }

fragment Event on EventGQLModel {
      __typename
      id
      lastchange
      created
      createdbyId
      changedbyId
      rbacobjectId
      createdby { id }
      changedby { id }
      rbacobject { id }
      name
      nameEn
      description
      startdate
      enddate
      duration_raw
      place
      facilityId
      facility { id }
      reservations { id }
      mastereventId
      parent { id }
      children { id }
      typeId
      type { id }
      invitations { id }
      # duration
    }

fragment EventType on EventTypeGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby {
  ...User
}
    changedby {
  ...User
}
    rbacobject {
  ...RBACObject
}
    name
    nameEn
    description
    parentId
    parent { id }
    children { id }
    events {
  ...Event
}
  }

fragment Error on EventTypeGQLModelUpdateError {
    __typename
    Entity {
  ...EventType
}
    msg
    failed
    input
  }
