query digitalDocumentById($id: UUID!) {
  digitalDocumentById(id: $id) {
  ...DigitalForm
}
}

fragment User on UserGQLModel {
    __typename
    id
  }

fragment RBACObject on RBACObjectGQLModel {
    __typename
    id
  }

fragment State on StateGQLModel {
    __typename
    id
  }

fragment DocumentType on DocumentTypeGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby { id }
    changedby { id }
    rbacobject { id }
    name
    nameEn
    description
    parentId
    parent { id }
    children { id }
  }

fragment DigitalFormSection on DigitalFormSectionGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby { id }
    changedby { id }
    rbacobject { id }
    name
    path
    label
    labelEn
    description
    parentId
    sections { id }
    fields { id }
    order
    repatableMin
    repatableMax
    repeatable
    parent { __typename }
  }

fragment DigitalSubmission on DigitalSubmissionGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby { id }
    changedby { id }
    rbacobject { id }
    name
    nameEn
    description
    stateId
    state { id }
    parentId
    typeId
    type { id }
    submittedSections { id }
    submittedFields { id }
    submittedSectionsAll { id }
  }

fragment DigitalForm on DigitalFormGQLModel {
  __typename
  id
  lastchange
  created
  createdbyId
  changedbyId
  rbacobjectId
  createdby {
  ...User
}
  changedby {
  ...User
}
  rbacobject {
  ...RBACObject
}
  name
  nameEn
  description
  stateId
  state {
  ...State
}
  parentId
  typeId
  type {
  ...DocumentType
}
  sections {
  ...DigitalFormSection
}
  submissions {
  ...DigitalSubmission
}
}
