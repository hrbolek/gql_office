query digitalDocumentPage($skip: Int, $limit: Int, $orderby: String, $where: DigitalFormInputFilter) {
  digitalDocumentPage(skip: $skip, limit: $limit, orderby: $orderby, where: $where) {
  ...DigitalForm
}
}

fragment User on UserGQLModel {
  __typename
  id
  }

fragment RBACObject on RBACObjectGQLModel {
  __typename
  id
  }

fragment State on StateGQLModel {
  __typename
  id
  }

fragment DocumentType on DocumentTypeGQLModel {
  __typename
  id
  lastchange
  created
  createdbyId
  changedbyId
  rbacobjectId
  createdby { __typename }
  changedby { __typename }
  rbacobject { __typename }
  name
  nameEn
  description
  parentId
  parent { __typename }
  children { __typename }
  }

fragment DigitalFormSection on DigitalFormSectionGQLModel {
  __typename
  id
  lastchange
  created
  createdbyId
  changedbyId
  rbacobjectId
  createdby { __typename }
  changedby { __typename }
  rbacobject { __typename }
  name
  path
  label
  labelEn
  description
  parentId
  sections { __typename }
  fields { __typename }
  order
  repatableMin
  repatableMax
  repeatable
  parent { __typename }
  }

fragment DigitalSubmission on DigitalSubmissionGQLModel {
  __typename
  id
  lastchange
  created
  createdbyId
  changedbyId
  rbacobjectId
  createdby { __typename }
  changedby { __typename }
  rbacobject { __typename }
  formId
  parentId
  form { __typename }
  parent { __typename }
  submittedSections { __typename }
  submittedFields { __typename }
  submittedSectionsAll { __typename }
  }

fragment DigitalForm on DigitalFormGQLModel {
__typename
id
lastchange
created
createdbyId
changedbyId
rbacobjectId
createdby {
  ...User
}
changedby {
  ...User
}
rbacobject {
  ...RBACObject
}
name
nameEn
description
stateId
state {
  ...State
}
parentId
typeId
type {
  ...DocumentType
}
sections {
  ...DigitalFormSection
}
submissions {
  ...DigitalSubmission
}
}
