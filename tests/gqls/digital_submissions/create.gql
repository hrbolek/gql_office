    changedbyId
    rbacobjectId
    createdby { __typename }
    changedby { __typename }
    rbacobject { __typename }
    name
    nameEn
    description
    stateId
    state { __typename }
    parentId
    typeId
    type { __typename }
    sections { __typename }
    submissions { __typename }
    }

