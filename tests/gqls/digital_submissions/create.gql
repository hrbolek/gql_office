mutation digitalFormSubmissionInsert($formId: UUID!, $name: String, $nameEn: String, $parentId: UUID, $id: UUID, $sections: [SubmissionSectionInsertGQLModel!]) {
  digitalFormSubmissionInsert(digitalFormSubmission: {formId: $formId, name: $name, nameEn: $nameEn, parentId: $parentId, id: $id, sections: $sections}) {
    ... on DigitalSubmissionGQLModel { ...DigitalSubmission }
    ... on InsertError { ...InsertError }
  }
}

fragment User on UserGQLModel {
