mutation digitalFormSectionUpdate($id: UUID!, $lastchange: DateTime!, $name: String, $nameEn: String) {
  digitalFormSectionUpdate(digitalFormSection: {id: $id, lastchange: $lastchange, name: $name, nameEn: $nameEn}) {
    ... on DigitalFormSectionGQLModel { ...DigitalFormSection }
    ... on DigitalFormSectionGQLModelUpdateError { ...Error }
  }
}

fragment User on UserGQLModel {
    __typename
    id
    }

fragment RBACObject on RBACObjectGQLModel {
    __typename
    id
    }

fragment DigitalFormField on DigitalFormFieldGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby { __typename }
    changedby { __typename }
    rbacobject { __typename }
    name
    label
    labelEn
    description
    formSectionId
    formSection { __typename }
    formId
    form { __typename }
    required
    order
    computed
    formula
    typeId
    backendFormula
    flattenFormula
    }

fragment DigitalFormSection on DigitalFormSectionGQLModel {
  __typename
  id
  lastchange
  created
  createdbyId
  changedbyId
  rbacobjectId
  createdby {
  ...User
}
  changedby {
  ...User
}
  rbacobject {
  ...RBACObject
}
  name
  path
  label
  labelEn
  description
  parentId
  sections { __typename }
  fields {
  ...DigitalFormField
}
  order
  repatableMin
  repatableMax
  repeatable
  parent {
        ... on DigitalFormSectionGQLModel { __typename id } # ... on DigitalFormSectionGQLModel { ...DigitalFormSection }
        ... on DigitalFormGQLModel { __typename id } # ... on DigitalFormGQLModel { ...DigitalForm }
      }
  }

fragment Error on DigitalFormSectionGQLModelUpdateError {
  __typename
  Entity {
  ...DigitalFormSection
}
  msg
  failed
  input
  }
