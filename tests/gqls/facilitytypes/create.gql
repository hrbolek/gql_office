mutation facilityTypeInsert($name: String, $nameEn: String, $parentId: UUID, $id: UUID) {
  facilityTypeInsert(facilityType: {name: $name, nameEn: $nameEn, parentId: $parentId, id: $id}) {
  ... on FacilityTypeGQLModel { ...FacilityType }
  ... on InsertError { ...InsertError }
}
}

fragment User on UserGQLModel {
      __typename
      id
    }

fragment RBACObject on RBACObjectGQLModel {
      __typename
      id
    }

fragment FacilityType on FacilityTypeGQLModel {
    __typename
    id
    lastchange
    created
    createdbyId
    changedbyId
    rbacobjectId
    createdby {
  ...User
}
    changedby {
  ...User
}
    rbacobject {
  ...RBACObject
}
    name
    nameEn
    parent { id }
    parentId
    children { id }
  }

fragment InsertError on InsertError {
    __typename
    msg
    failed
    input
  }
