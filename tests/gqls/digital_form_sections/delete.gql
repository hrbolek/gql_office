mutation digitalFormSectionDelete($id: UUID!, $lastchange: DateTime!) {
  digitalFormSectionDelete(digitalFormSection: {id: $id, lastchange: $lastchange}) {
  ...DigitalFormSectionGQLModelDeleteError
}
}

